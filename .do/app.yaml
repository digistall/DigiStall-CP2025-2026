# DigitalOcean App Platform Configuration
# DigiStall - Stall Management System

name: digistall

# Region - Singapore for best latency to Philippines
region: sgp

# ===== SERVICES =====
services:
  # Backend Web API Service
  - name: digistall-api-web
    github:
      branch: FullBranch
      deploy_on_push: true
      repo: digistall/DigiStall-CP2025-2026
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 3001
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /api
    envs:
      # Server Configuration
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Database Configuration (DigitalOcean Managed Database)
      - key: DB_HOST
        value: ${digistall-db.HOSTNAME}
      - key: DB_PORT
        value: ${digistall-db.PORT}
      - key: DB_USER
        value: ${digistall-db.USERNAME}
      - key: DB_PASSWORD
        value: ${digistall-db.PASSWORD}
      - key: DB_NAME
        value: ${digistall-db.DATABASE}
      - key: DB_SSL
        value: "true"
      # CORS
      - key: CORS_ORIGIN
        value: "http://digi-stall.com"
      - key: ALLOWED_ORIGINS
        value: "http://digi-stall.com,http://68.183.154.125"
      # JWT Configuration
      - key: JWT_SECRET
        type: SECRET
        value: your-super-secret-jwt-key-change-this-in-production
      - key: JWT_REFRESH_SECRET
        type: SECRET
        value: your-refresh-secret-key-change-this-in-production

  # Backend Mobile API Service
  - name: digistall-api-mobile
    github:
      branch: FullBranch
      deploy_on_push: true
      repo: digistall/DigiStall-CP2025-2026
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 3001
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /api/mobile
    envs:
      # Server Configuration
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Database Configuration
      - key: DB_HOST
        value: ${digistall-db.HOSTNAME}
      - key: DB_PORT
        value: ${digistall-db.PORT}
      - key: DB_USER
        value: ${digistall-db.USERNAME}
      - key: DB_PASSWORD
        value: ${digistall-db.PASSWORD}
      - key: DB_NAME
        value: ${digistall-db.DATABASE}
      - key: DB_SSL
        value: "true"
      # CORS (Allow all for mobile)
      - key: CORS_ORIGIN
        value: "*"
      - key: ALLOWED_ORIGINS
        value: "*"
      # JWT Configuration
      - key: JWT_SECRET
        type: SECRET
        value: your-super-secret-jwt-key-mobile-change-this
      - key: JWT_REFRESH_SECRET
        type: SECRET
        value: your-refresh-secret-key-mobile-change-this

# ===== STATIC SITES =====
static_sites:
  # Frontend Web Application
  - name: digistall-web
    github:
      branch: FullBranch
      deploy_on_push: true
      repo: digistall/DigiStall-CP2025-2026
    source_dir: /FRONTEND/WEB
    dockerfile_path: Dockerfile.prod
    build_command: npm install && npm run build
    output_dir: dist
    index_document: index.html
    error_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        value: ${APP_URL}/api
        scope: BUILD_TIME

# ===== DATABASES =====
databases:
  - name: digistall-db
    engine: MYSQL
    version: "8"
    production: false
    cluster_name: digistall-mysql
    db_name: naga_stall
    db_user: doadmin

# ===== ALERTS =====
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
