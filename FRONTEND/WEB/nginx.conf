server {
    listen 80;
    server_name digi-stall.com www.digi-stall.com;
    
    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name digi-stall.com www.digi-stall.com;

    # SSL Certificates (these will be mounted from the host)
    ssl_certificate /etc/letsencrypt/live/digi-stall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digi-stall.com/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Security Headers (Vector 2)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.emailjs.com; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /favicon.ico {
        rewrite ^/favicon.ico$ /favicon.png last;
    }

    # Block sensitive/scanner paths — return 404 (Vector 5)
    # (Note: .env, .git, and phpmyadmin are excluded here so they fall through to the tarpit below)
    location ~* ^/(\.svn|\.htaccess|\.htpasswd|\.DS_Store|\.aws|wp-config\.php|wp-login\.php|phpinfo\.php|adminer\.php|config\.(json|yml|yaml)|nginx\.conf|backup\.(sql|zip)|db\.sql|database\.sql|server-(status|info)|debug|trace|console|__debug__|swagger\.json|openapi\.json|api-docs|crossdomain\.xml|elmah\.axd|xmlrpc\.php) {
        return 404;
    }

    # Clean 405 error page to prevent injection indicator leaks (Vector 4)
    error_page 405 =405 @method_not_allowed;
    location @method_not_allowed {
        default_type application/json;
        return 405 '{"success":false,"message":"Method not allowed"}';
    }

    # Rate limiting for frontend auth routes (Vectors 3, 8, 9)
    location = /login {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.html;
    }

    location = /forgot-password {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        try_files $uri /index.html;
    }

    location ^~ /digistall_uploads/ {
        proxy_pass http://backend-web:3001/digistall_uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Forward common vulnerability scanner paths to the backend tripwire
    location ~* ^/(wp-admin|\.env|\.git|admin/config\.php|phpmyadmin) {
        proxy_pass http://backend-web:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend-web:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API proxy to mobile backend
    location /mobile-api/ {
        rewrite ^/mobile-api/(.*)$ /api/$1 break;
        proxy_pass http://backend-mobile:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
